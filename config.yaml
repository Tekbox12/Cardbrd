meta:
  engine: 4.1.0
  author: Tekbox
units:
  # Proxy Spacing Variables
  kx: u
  ky: u
  # Padding Variables
  px: kx + 4
  py: ky + 4
  #double pad
  dpx: kx + 8
  dpy: ky + 8
  #Defaults to M2 Screws
  screwSize: 1

  standoffSize: 2.5

  $default_height: u-1
  $default_width: u-1

points:
  zones:
    matrix:
      columns:
        right:
          key:
            column_net: P14
        middle:
          key:
            column_net: P16
        left:
          key:
            column_net: P10
      rows:
        one:
          row_net: P15
        two:
          row_net: P18
        three:
          row_net: P19
        four:
          row_net: P9
      anchor:
        shift: [100, -100]
outlines:
  raw:
  - what: rectangle
    where: true
    size: [kx, ky]
  keys:
    - what: rectangle
      where: true
      size: [kx-0.5,ky-0.5]
  board:
    - what: polygon
      operation: stack
      #for some reason right is left and left is right
      #i have no idea how to fix this
      #and row four is the top row???? 
      points:
        #ACTUAL LOCATONS

        #bottom left
        - ref: matrix_right_one
          shift: [-1.5px,-0.5py]

        #top left
        - ref: matrix_right_four
          shift: [-1.5px,0.5py]

        #top right
        - ref: matrix_left_four
          shift: [0.5px,0.5py]

          #bottom right
        - ref: matrix_left_one
          shift: [0.5px,-0.5py]
      fillet: 2
  xlBoard:
    - what: polygon
      operation: stack

      points:
        #ACTUAL LOCATONS

        #bottom left
        - ref: matrix_right_one
          shift: [-1.5dpx,-0.5dpy]

        #top left
        - ref: matrix_right_four
          shift: [-1.5dpx,0.5dpy]

        #top right
        - ref: matrix_left_four
          shift: [0.5dpx,.5dpy]

          #bottom right
        - ref: matrix_left_one
          shift: [0.5dpx,-0.5dpy]
      fillet: 2 
  combo:
    - name: board
    - operation: subtract
      name: keys
  mounting:
    - what: circle
      radius: screwSize
      where:
        ref: matrix_left_four
        shift: [-0.5kx, -0.5ky]
      
    - what: circle
      radius: screwSize
      where:
        ref: matrix_left_one
        shift: [-0.5kx, 0.5ky]
      
    - what: circle
      radius: screwSize
      where:
        ref: matrix_right_one
        shift: [0.5kx, 0.5ky]
      
    - what: circle
      radius: screwSize
      where:
        ref: matrix_right_four
        shift: [0.5kx, -0.5ky]
  standoff:
    - what: circle
      radius: standoffSize
      where:
        ref: matrix_left_four
        shift: [-0.5kx, -0.5ky]
      
    - what: circle
      radius: standoffSize
      where:
        ref: matrix_left_one
        shift: [-0.5kx, 0.5ky]
      
    - what: circle
      radius: standoffSize
      where:
        ref: matrix_right_one
        shift: [0.5kx, 0.5ky]
      
    - what: circle
      radius: standoffSize
      where:
        ref: matrix_right_four
        shift: [0.5kx, -0.5ky]

pcbs:
  tutorial:
    outlines:
      main:
        outline: board
    footprints:
      mx_hotswap:
        what: mx
        where: true
        params:
          keycaps: true
          reverse: false
          hotswap: false
          from: "{{column_net}}"
          to: "{{colrow}}"  
      diode:
        what: diode
        where: true
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [0, -9.525]
      promicro:
        what: promicro
        params:
          orientation: "up"
        where:
          ref: matrix_right_four  
          #-1.5px is the board outline 
          #18/2 is half aprrox half of the pro mircos width
          #+2 is just padding
          #1.5py is the board outline 
          #-33/2 is the pro micros length
          #-4 is padding
          shift: [-1.5px+18/2+2,.5py-33/2-4]
          rotate: -90
      rotary:
        what: rotary
        params:
          from: P3
          to: GND
          A: P4
          B: P5
          C: GND
        where:
          ref: matrix_right_four
          shift: [-1.5px+18/2+2+0.625,.5py-33-4-7.5]

      reset:
        what: button
        params:
          from: GND
          to: RST
        where: 
          ref: matrix_right_four
          shift: [-1.5px+18/2+2+0.625,.5py-33-4-7.5-6.85-4-2]
          rotate: -90
      holeBottomRight:
        what: mountinghole
        where:
          ref: matrix_left_four
          shift: [-0.5kx, -0.5ky]
      holeTopRight:
        what: mountinghole
        where:
          ref: matrix_left_one
          shift: [-0.5kx, 0.5ky]
      holeBottomLeft:
        what: mountinghole
        where:
          ref: matrix_right_one
          shift: [0.5kx, 0.5ky]
      holeTopLeft:
        what: mountinghole
        where:
          ref: matrix_right_four
          shift: [0.5kx, -0.5ky]
cases:
  bottom:
    - name: board
      extrude: 1
  xlBottom:
    - name: xlBoard
      extrude: 1
  _outerWall:
    - name: xlBoard
      extrude: 5.6
  _innerWall:
    - name: board
      extrude: 5.6
  wall:
    - what: case
      name: _outerWall
      operation: add
    - what: case
      name: _innerWall
      operation: subtract
  _holes:
    - name: mounting
      extrude: 4
  _standoffs:
    - name: standoff
      extrude: 4
  case:
    - what: case
      name: _standoffs
      operation: add
    - what: case
      name: _holes
      operation: subtract
    - what: case
      name: xlBottom
      operation: add
    - what: case
      name: wall
      operation: add
